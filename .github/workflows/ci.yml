name: MovieHub CI/CD

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/MovieHub.sln

      - name: Build
        run: dotnet build src/MovieHub.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/MovieHub.Tests/MovieHub.Tests.csproj --configuration Release --no-build

      - name: Publish
        run: dotnet publish src/MovieHub.csproj --configuration Release --output publish --self-contained true -r win-x86

      - name: Deploy to Azure
        if: github.ref == 'refs/heads/main'
        uses: azure/webapps-deploy@v3
        with:
          app-name: moviehub-badboys-site
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish