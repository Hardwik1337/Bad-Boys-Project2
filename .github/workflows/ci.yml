name: MovieHub CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/MovieHub.sln

      - name: Build
        run: dotnet build src/MovieHub.sln --configuration Release --no-restore

      - name: Install Playwright browsers
        run: pwsh src/MovieHub.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps

      - name: Test
        run: dotnet test src/MovieHub.sln --configuration Release --no-build